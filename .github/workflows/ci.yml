name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          version: "0.13.10"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src/
      - run: uv run --locked ruff format --check src/

  typecheck:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          version: "0.13.10"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run --locked mypy src/

  test-stdio:
    name: Integration Tests (stdio)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          version: "0.13.10"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: uv lock --check
      - run: uv sync --locked
      - name: Run stdio integration tests
        if: ${{ env.DATABASE_URI != '' }}
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: uv run --locked python tests/integration/run_mcp_tests.py "uv run --locked teradata-mcp-server"
      - name: Warn if DATABASE_URI not configured
        if: ${{ env.DATABASE_URI == '' }}
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: echo "::warning::DATABASE_URI secret is not configured — stdio integration tests were skipped. See .github/CI.md for setup instructions."

  test-http:
    name: Integration Tests (streamable-http)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          version: "0.13.10"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: uv lock --check
      - run: uv sync --locked
      - name: Run HTTP integration tests
        if: ${{ env.DATABASE_URI != '' }}
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: uv run --locked python tests/integration/run_mcp_tests.py "uv run --locked teradata-mcp-server" --transport streamable-http
      - name: Warn if DATABASE_URI not configured
        if: ${{ env.DATABASE_URI == '' }}
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: echo "::warning::DATABASE_URI secret is not configured — HTTP integration tests were skipped. See .github/CI.md for setup instructions."

  offline-tests:
    name: Offline tests and wheel
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.10"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: uv lock --check && uv sync --locked --extra dev
      - run: uv run --locked python tests/integration/middleware_transport_tests.py
      - run: uv run --locked python tests/integration/smoke_http.py --server-cmd "uv run --locked teradata-mcp-server"
      - run: uv run --locked pytest tests/integration/test_guard_mode.py tests/integration/test_set_state_sessionless.py tests/integration/test_runner_errors.py
      - run: uv build

  eval-offline:
    name: Evaluation lock and offline tests
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    defaults:
      run:
        working-directory: tests/eval_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.10"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: uv lock --check && uv sync --locked
      - run: uv run --locked pytest tests/test_checks.py tests/test_multi_turn.py tests/test_report.py tests/test_suggest_overrides.py tests/test_description_overrides.py
