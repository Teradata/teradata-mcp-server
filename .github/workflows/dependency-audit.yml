name: Dependency audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '19 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Full dependency audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ['.', 'tests/eval_test']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.10'
      - name: Audit locked graph
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          set +e
          uv audit --locked
          result=$?
          set -e
          if [ "$result" -eq 1 ]; then
            echo '::warning::Existing dependency findings require triage; see audit output.'
          elif [ "$result" -ne 0 ]; then
            echo '::error::Dependency audit failed to execute.'
            exit "$result"
          fi
